<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION FORGE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .header { text-align: center; padding: 40px 0 20px; }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
    .tagline { font-size: 14px; color: #888; }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; }
    .user-msg { background: #1a1a1a; align-self: flex-end; }
    .ai-msg { background: #111; align-self: flex-start; border: 1px solid #222; }
    .input-area {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid #222;
    }
    #promptInput {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 14px 18px;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
    }
    #sendBtn {
      background: #fff;
      color: #000;
      border: none;
      padding: 0 24px;
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
    }
    .status { text-align: center; font-size: 12px; color: #666; padding: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">ORION FORGE</div>
    <div class="tagline">Build Apps, Games & AI from Text</div>
  </div>
  
  <div class="chat-container" id="chatContainer">
    <div class="message ai-msg">
      ORION FORGE V1 Online. Type your app idea and I'll build it. Powered by Groq Llama 3.1
    </div>
  </div>
  
  <div class="status" id="status">Ready</div>
  
  <div class="input-area">
    <input type="text" id="promptInput" placeholder="Describe the app you want to build..." autocomplete="off">
    <button id="sendBtn">Forge</button>
  </div>

  <script>
    const GROQ_API_KEY = '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';
    const GROQ_API_KEY = 'YOUR_GROQ_KEY_HERE';
    const chatContainer = document.getElementById('chatContainer');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    async function forgeApp() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      
      addMessage(prompt, 'user');
      promptInput.value = '';
      status.textContent = 'Forging...';
      sendBtn.disabled = true;
      
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GROQ_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.1-70b-versatile',
            messages: [
              {role: 'system', content: 'You are ORION FORGE. Generate complete, single-file HTML apps with inline CSS/JS. No external dependencies. Make it beautiful and functional.'},
              {role: 'user', content: prompt}
            ],
            temperature: 0.7,
            max_tokens: 4000
          })
        });
        
        const data = await res.json();
        const code = data.choices[0].message.content;
        addMessage('App forged. Opening preview...', 'ai');
        
        const blob = new Blob([code], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        
        status.textContent = 'Ready';
      } catch (err) {
        addMessage('Forge failed. Check your Groq API key.', 'ai');
        status.textContent = 'Error';
      }
      sendBtn.disabled = false;
    }
    
    function addMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `message ${type}-msg`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    sendBtn.onclick = forgeApp;
    promptInput.onkeypress = e => e.key === 'Enter' && forgeApp();
  </script>
</body>
</html>
