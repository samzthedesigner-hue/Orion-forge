<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION FORGE V2.1</title>
  <meta name="theme-color" content="#0a0a0a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column;
    }
   .header { 
      padding: 16px; border-bottom: 1px solid #262626; text-align: center;
      background: #111; position: sticky; top: 0; z-index: 10;
    }
   .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
   .header p { font-size: 12px; color: #888; margin-top: 4px; }
   .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
   .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; }
   .msg.user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
   .msg.ai { background: #1a1a1a; border: 1px solid #262626; align-self: flex-start; border-bottom-left-radius: 4px; }
   .templates { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 16px; }
   .template-btn { 
      background: #1a1a1a; border: 1px solid #333; color: #e5e5e5; 
      padding: 8px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
    }
   .template-btn:active { background: #262626; }
   .input-area { 
      padding: 16px; border-top: 1px solid #262626; background: #111; 
      position: sticky; bottom: 0;
    }
   .input-wrap { display: flex; gap: 8px; }
    #prompt { 
      flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e5e5e5;
      padding: 12px 16px; border-radius: 24px; font-size: 16px; outline: none;
    }
    #forge-btn { 
      background: #2563eb; border: none; color: white; padding: 0 20px;
      border-radius: 24px; font-weight: 600; cursor: pointer;
    }
    #forge-btn:disabled { background: #1e3a8a; opacity: 0.5; }
   .output { display: none; background: #000; border-top: 1px solid #262626; }
   .output.active { display: block; }
   .tabs { display: flex; border-bottom: 1px solid #262626; }
   .tab { 
      flex: 1; padding: 12px; background: #111; border: none; color: #888; 
      cursor: pointer; font-weight: 600;
    }
   .tab.active { color: #e5e5e5; background: #000; border-bottom: 2px solid #2563eb; }
   .tab-content { display: none; height: 50vh; }
   .tab-content.active { display: block; }
    #preview-frame { width: 100%; height: 100%; border: none; background: white; }
    #code-block { 
      width: 100%; height: 100%; background: #0a0a0a; color: #e5e5e5; 
      border: none; padding: 16px; font-family: monospace; font-size: 12px; resize: none;
    }
   .actions { display: flex; gap: 8px; padding: 12px 16px; background: #111; }
   .action-btn { 
      flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e5e5e5;
      padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
   .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; 
      border-top: 2px solid #e5e5e5; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>ORION FORGE V2.1</h1>
    <p>Powered by Groq Llama 3.3</p>
  </div>

  <div class="chat" id="chat">
    <div class="msg ai">
      ORION FORGE V2.1 Online. I build real apps from text. 
      Try a template below or describe what you want.
    </div>
  </div>

  <div class="templates">
    <button class="template-btn" onclick="setPrompt('A snake game in one HTML file')">🐍 Snake Game</button>
    <button class="template-btn" onclick="setPrompt('A todo app with local storage')">✅ Todo App</button>
    <button class="template-btn" onclick="setPrompt('A landing page for a SaaS product')">🚀 Landing Page</button>
    <button class="template-btn" onclick="setPrompt('A calculator with dark mode')">🧮 Calculator</button>
  </div>

  <div class="output" id="output">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('preview', this)">Preview</button>
      <button class="tab" onclick="switchTab('code', this)">Code</button>
    </div>
    <div class="tab-content active" id="preview-tab">
      <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
    </div>
    <div class="tab-content" id="code-tab">
      <textarea id="code-block" readonly></textarea>
    </div>
    <div class="actions">
      <button class="action-btn" onclick="copyCode()">📋 Copy Code</button>
      <button class="action-btn" onclick="downloadCode()">💾 Download.html</button>
      <button class="action-btn" onclick="closeOutput()">✖ Close</button>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <input id="prompt" placeholder="Describe the app you want..." onkeypress="if(event.key==='Enter') forge()">
      <button id="forge-btn" onclick="forge()">Forge</button>
    </div>
  </div>

<script>
const GROQ_API_KEY = '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';
const MODEL = 'llama-3.3-70b-versatile';
let currentCode = '';
let currentPrompt = '';

function setPrompt(text) {
  document.getElementById('prompt').value = text;
  document.getElementById('prompt').focus();
}

function addMessage(text, isUser = false) {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = `msg ${isUser? 'user' : 'ai'}`;
  msg.textContent = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function addLoadingMessage() {
  const chat = document.getElementById('chat');
  const msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.id = 'loading-msg';
  msg.innerHTML = '<span class="loader"></span> Forging your app...';
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoadingMessage() {
  document.getElementById('loading-msg')?.remove();
}

async function forge() {
  const promptEl = document.getElementById('prompt');
  const btn = document.getElementById('forge-btn');
  const prompt = promptEl.value.trim();
  
  if (!prompt) return;
  
  currentPrompt = prompt;
  addMessage(prompt, true);
  addLoadingMessage();
  promptEl.value = '';
  btn.disabled = true;
  
  try {
    const systemPrompt = `You are ORION FORGE. Generate a complete, single HTML file for: "${prompt}". 
    Requirements:
    1. Use CDN links for any libraries. No build step.
    2. Include all CSS and JS inline in one file.
    3. Make it mobile-responsive and visually polished.
    4. Output ONLY the HTML code. Start with <!DOCTYPE html> and end with </html>. No explanations.`;
    
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${GROQ_API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'user', content: systemPrompt }],
        temperature: 0.7,
        max_tokens: 4000
      })
    });
    
    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(`API Error ${response.status}: ${errData.error?.message || response.statusText}`);
    }
    
    const data = await response.json();
    currentCode = data.choices[0].message.content;
    
    // Clean markdown fences if present
    currentCode = currentCode.replace(/^```html\n?/, '').replace(/\n?```$/, '');
    
    removeLoadingMessage();
    addMessage('App forged. Check the preview below.');
    showOutput();
    saveToHistory(prompt, currentCode);
    
  } catch (err) {
    removeLoadingMessage();
    addMessage(`Forge failed: ${err.message}. Try a different prompt or check if Groq blocked it.`);
  } finally {
    btn.disabled = false;
  }
}

function showOutput() {
  document.getElementById('output').classList.add('active');
  document.getElementById('code-block').value = currentCode;
  document.getElementById('preview-frame').srcdoc = currentCode;
  switchTab('preview');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelector(`.tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById(`${tab}-tab`).classList.add('active');
}

function copyCode() {
  navigator.clipboard.writeText(currentCode);
  event.target.textContent = '✓ Copied';
  setTimeout(() => event.target.textContent = '📋 Copy Code', 2000);
}

function downloadCode() {
  const blob = new Blob([currentCode], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${currentPrompt.slice(0,20).replace(/[^a-z0-9]/gi,'_')}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

function closeOutput() {
  document.getElementById('output').classList.remove('active');
}

function saveToHistory(prompt, code) {
  let history = JSON.parse(localStorage.getItem('orion_history') || '[]');
  history.unshift({ prompt, code, date: new Date().toISOString() });
  history = history.slice(0, 10);
  localStorage.setItem('orion_history', JSON.stringify(history));
}

window.onload = () => {
  const history = JSON.parse(localStorage.getItem('orion_history') || '[]');
  if (history.length > 0) {
    addMessage(`Welcome back. You have ${history.length} saved forges. Type a new idea to begin.`);
  }
};
</script>
</body>
</html>
